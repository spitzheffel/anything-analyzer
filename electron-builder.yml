appId: com.anything.analyzer
productName: Anything Analyzer
directories:
  buildResources: resources
files:
  - 'out{,/**}'
  - 'package.json'
  - from: resources
    to: resources
    filter:
      - icon.png
  - '!**/.vscode/*'
  - '!src{,/**}'
  - '!tests{,/**}'
  - '!**/tests{,/**}'
  - '!**/__tests__{,/**}'
  - '!dist{,/**}'
  - '!dist-internal{,/**}'
  - '!output{,/**}'
  - '!**/node_modules/cloakbrowser{,/**}'
  - '!**/node_modules/playwright-core{,/**}'
  - '!**/node_modules/mmdb-lib{,/**}'
  - '!**/node_modules/socks-proxy-agent{,/**}'
  - '!**/node_modules/tar{,/**}'
  - '!**/node_modules/tar/**'
  - '!**/node_modules/tar/node_modules{,/**}'
  - '!**/node_modules/tar/node_modules/chownr{,/**}'
  - '!**/node_modules/chownr{,/**}'
  - '!**/.cloakbrowser{,/**}'
  - '!**/browser-profiles/cloak{,/**}'
  - '!**/license.key'
  - '!**/.license_cache'
  - '!**/chromium-[0-9]*{,/**}'
  - '!**/_download_*.{zip,tar.gz}'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
publish:
  provider: github
  owner: Mouseww
  repo: anything-analyzer
win:
  target:
    - nsis
  artifactName: "Anything-Analyzer-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  type: distribution
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - dmg
    - zip
  artifactName: "Anything-Analyzer-${version}-${arch}.${ext}"
linux:
  target:
    - AppImage
  artifactName: "Anything-Analyzer-${version}.${ext}"
